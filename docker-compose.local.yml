# LOCAL DEVELOPMENT ONLY.
#
# This file spins up a throwaway local MongoDB alongside the backend and
# frontend so "containerized" and "talks to a real database" can never be
# the same command. Do not point MONGO_URL here at Atlas or any other
# hosted database, and do not add real credentials to this file -- every
# value below is a disposable local default, safe to commit. If you need
# to run against real data, run the app directly (npm run dev), not
# through this compose file.
#
# Assumes emr-mern-app is checked out as a sibling directory to this repo
# (the layout documented in the EMR workspace's CLAUDE.md). Usage:
#   docker compose -f docker-compose.local.yml up --build
#
# The AI assistant route (/api/v1/ask-ai) will return a clear error until
# you export a real OPENAI_API_KEY yourself -- it's optional for
# everything else the API does.

services:
  mongo:
    image: mongo:6
    volumes:
      - emr_local_mongo_data:/data/db

  backend:
    build:
      context: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URL: mongodb://mongo:27017/emr_local
      JWT_SECRET: local-dev-jwt-secret-do-not-use-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - mongo

  frontend:
    build:
      context: ../emr-mern-app
      args:
        NEXT_PUBLIC_SERVER_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SERVER_URL: http://localhost:5000/api/v1
    depends_on:
      - backend

volumes:
  emr_local_mongo_data:
